[workspace]
resolver = "2"
members = [
  "baml-compiler",
  "baml-viz-events",
  "baml-lib/*",
  "baml-lsp-types",
  "baml-rpc",
  "baml-ids",
  "baml-runtime",
  "baml-schema-wasm",
  "baml-vm",
  "bstd",
  "cli",
  "tools",
  "language_client_python",
  # "language_client_ruby/ext/ruby_ffi",
  "language_client_typescript",
  "language_server",
  "language_client_cffi",
  "llm-response-parser",
  "generators/utils/*",
  "generators/languages/*",
  "sandbox",
  "boundary-udf",
  "playground-server",
]
default-members = [
  "baml-compiler",
  "baml-lsp-types",
  "baml-lib/*",
  "baml-rpc",
  "baml-viz-events",
  "baml-ids",
  "baml-runtime",
  # Disabled by default: --features no_wasm and --features wasm are mutually exclusive
  # Building baml-schema-wasm in combination with everything else triggers feature unification,
  # and it's OK to not build this by default because we have to build ts separately (this may
  # also have something to do with resolver=2 and how duplicate dep builds are handled)
  # "baml-schema-wasm",
  "baml-vm",
  "bstd",
  "cli",
  "language_client_cffi",
  "language_client_python",
  "language_client_typescript",
  "language_server",
  "generators/utils/*",
  "generators/languages/*",
]

[workspace.dependencies]
# Semver: use minor/patch ranges (e.g. "1", "0.4") for flexibility; exact pins only where required (wasm, aws).
anyhow = "1"
askama = { version = "0.14", features = ["code-in-doc"] }
async-std = "1"
axum = "0.7"
baml-cli = { path = "cli" }
baml-derive = { path = "baml-lib/baml-derive" }
baml-ids = { path = "baml-ids" }
baml-rpc = { path = "baml-rpc" }
baml-types = { path = "baml-lib/baml-types" }
baml-log = { path = "baml-lib/baml-log" }
baml-viz-events = { path = "baml-viz-events" }
base64 = "0.22"
bstd = { path = "bstd" }
blake3 = "1"
bytes = "1"
cfg-if = "1"
chrono = "0.4"
clap = { version = "4", features = ["cargo", "derive"] }
criterion = "0.5"
colored = "2"
console_log = "1"
cowstr = { version = "1", features = ["serde"] }
dashmap = "5"
derive-new = "0.7"
derive_builder = "0.20"
derive_more = { version = "0.99", features = ["constructor"] }
dissimilar = "1"
dunce = "1"
either = "1"
envy = "0.4"
eventsource-stream = "0.2"
enum_dispatch = "0.3"
enumflags2 = "0.7"
env_logger = "0.11"
expect-test = "1"
fastrand = "2"
filetime = "0.2"
flate2 = "1"
futures = { version = "0.3", features = ["executor"] }
google-cloud-auth = "1"
http = "1"
http-body = "1"
indexmap = { version = "2", features = ["serde"] }
include_dir = "0.7"
indoc = "2"
infer = "0.16"
internal-baml-core = { path = "baml-lib/baml-core" }
internal-baml-jinja = { path = "baml-lib/jinja-runtime" }
playground-server = { path = "playground-server" }
internal-llm-client = { path = "baml-lib/llm-client" }
itertools = "0.14"
json_comments = "0.2"
jsonish = { path = "baml-lib/jsonish" }
log = "0.4"
log-once = "0.4"
mime = "0.3"
mime_guess = "2"
# TODO: disable imports, etc
# minijinja = { path = "../third_party/minijinja/minijinja", default-features = false, features = [
minijinja = { git = "https://github.com/boundaryml/minijinja.git", branch = "main", default-features = false, features = [
  "macros",
  "builtins",
  "debug",
  "preserve_order",
  "adjacent_loop_items",
  "unicode",
  "json",
  "unstable_machinery",
  "unstable_machinery_serde",
  "custom_syntax",
  "internal_debug",
  "deserialization",
  "serde",
  # We don't want to use these features:
  # multi_template
  # loader
  #
] }
once_cell = "1"
pathdiff = "0.2"
percent-encoding = "2"
pest = "2"
pest_derive = "2"
pretty = "0.12"
pretty_assertions = "1"
proc-macro2 = "1"
quote = "1"
rand = "0.8"
rayon = "1"
regex = "1"
reqwest-eventsource = "0.6"
rstest = "0.22"
reqwest = { version = "0.12", features = [
  "json",
  "native-tls-alpn",
  "native-tls-vendored",
  "stream",
] }
scopeguard = "1"
secrecy = { version = "0.10", features = ["serde"] }
semver = "1"
sha2 = "0.10"
shell-escape = "0.1"
shellwords = "1"
similar = "2"
serial_test = "3"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde = { version = "1", features = ["alloc", "derive", "rc"] }
serde_yaml = "0.9"
static_assertions = "1"
stream-cancel = "0.8"
strip-ansi-escapes = "0.2"
strsim = "0.11"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
sugar_path = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
test-log = "0.2"
textwrap = "0.16"
thiserror = "2"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio-stream = "0.1"
tracing = { version = "0.1", features = ["valuable"] }
tracing-core = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "valuable"] }
pin-project-lite = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
valuable = { version = "0.1", features = ["derive"] }
walkdir = "2"
tokio = { version = "1", default-features = false, features = [
  "macros",
  "time",
] }

js-sys = "=0.3.82"
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "0.4.42"
wasm-bindgen-test = "0.3.45"
web-sys = { version = "0.3.78", features = [
  "Crypto",
  "CryptoKey",
  "Headers",
  "Request",
  "RequestInit",
  "Response",
  "RequestMode",
  "SubtleCrypto",
  "Window",
] }
web-time = "1.1.0"
tsify = { version = "0.5.6", features = ["js"] }


[workspace.package]
version = "0.218.1"
authors = ["Boundary <contact@boundaryml.com>"]

description = "BAML Toolchain"
license-file = "LICENSE"

[workspace.metadata.crane]
name = "baml-workspace"

[workspace.metadata.workspaces]
allow_branch = "canary"

[profile.dev]
lto = false

[profile.dev2]
inherits = "dev"

[profile.release]
lto = true
