[package]
edition = "2021"
name = "baml-cli"
version.workspace = true
authors.workspace = true
description.workspace = true
license-file.workspace = true

[package.metadata.rustflags]
RSTEST_TIMEOUT = "10"

[build-dependencies]
anyhow.workspace = true

[lints.rust]
dead_code = "deny"
elided_named_lifetimes = "deny"
unused_imports = "deny"
unused_variables = "deny"

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-extra = { version = "0.9", features = ["erased-json", "typed-header"] }
baml-runtime = { path = "../baml-runtime", features = ["internal"] }
language-server = { path = "../language_server" }
baml-types.workspace = true
baml-log.workspace = true
base64.workspace = true
bstd.workspace = true
bytes.workspace = true
cfg-if.workspace = true
clap = { workspace = true, features = ["color", "env"] }
clap-cargo = "0.14"
colored.workspace = true
console = "0.15"
dashmap.workspace = true
derive_more.workspace = true
dialoguer = "0.11"
difference = "2"
dunce = "1"
either.workspace = true
env_logger.workspace = true
etcetera = "0.8"
eventsource-stream = "0.2"
futures.workspace = true
http.workspace = true
http-body.workspace = true
indexmap.workspace = true
indicatif = "0.17"
indicatif-log-bridge = "0.2"
indoc.workspace = true
internal-baml-core.workspace = true
generators-lib = { path = "../generators/utils/generators_lib" }
log.workspace = true
open = "5"
pathdiff = "0.1"
rand.workspace = true
reqwest.workspace = true
scopeguard.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = { version = "2", features = ["inline"] }
strsim.workspace = true
strum.workspace = true
strum_macros.workspace = true
tokio = { version = "1", default-features = false, features = [
  "macros",
  "time",
] }
tokio-stream = "0.1"
# NOTE(sam): adding this caused a build error, I suspect because tower uses nightly features or something
# tower = "0.5.0"
walkdir.workspace = true
uuid.workspace = true
web-time.workspace = true
static_assertions.workspace = true
mime_guess = "2"
mime = "0.3"

# For tracing
envy = "0.4"
chrono = "0.4"
stream-cancel = "0.8"
async-std = "1"
fastrand = "2"
test-log = "0.2"
infer = "0.16"
url = "2"
shell-escape = "0.1"
enum_dispatch = "0.3"
pretty_assertions = "1"
sha2 = "0.10"
tracing = "0.1"
# Valuable is needed to prevent serializing objects using Debug, and instead use Serialize.
# https://github.com/tokio-rs/tracing/issues/1570
tracing-subscriber = { version = "0.3", features = [
  "json",
  "env-filter",
  "valuable",
] }
ctrlc = "3"

# openssl = { version = "0.10", optional = true }

[features]
defaults = []
internal = []
skip-integ-tests = []
static-ssl = ["reqwest/native-tls-vendored"]

[dev-dependencies]
assert_cmd = "2"
console_log = "1"
dissimilar = "1"
expect-test = "1"
indoc.workspace = true
either = "1"
rstest = "0.22"
wasm-bindgen-test = "0.3"
walkdir = "2"
wasm-logger = "0.2"
