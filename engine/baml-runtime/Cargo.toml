[package]
edition = "2021"
name = "baml-runtime"
version.workspace = true
authors.workspace = true
description.workspace = true
license-file.workspace = true

[package.metadata.rustflags]
RSTEST_TIMEOUT = "10"

[build-dependencies]
anyhow.workspace = true

[lints.rust]
dead_code = "allow"
elided_named_lifetimes = "deny"
unused_imports = "allow"
unused_variables = "allow"

[lints.clippy]
module_inception = "allow"
result_large_err = "allow"
large_enum_variant = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
arc_with_non_send_sync = "allow"

[dependencies]
anyhow.workspace = true
baml-compiler = { path = "../baml-compiler" }
baml-ids.workspace = true
internal-baml-ast = { path = "../baml-lib/ast" }
internal-baml-diagnostics = { path = "../baml-lib/diagnostics" }
baml-log.workspace = true
baml-types.workspace = true
baml-rpc.workspace = true
baml-vm = { path = "../baml-vm" }
base64.workspace = true
bytes.workspace = true
cfg-if.workspace = true
colored = { workspace = true, optional = true }
cowstr.workspace = true
dashmap.workspace = true
derive-new.workspace = true
derive_more.workspace = true
dunce.workspace = true
either.workspace = true
eventsource-stream.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
indexmap.workspace = true
indoc.workspace = true
# instant = "0.1"  # do not use this or wasm-timer - use web-time instead
json_comments.workspace = true
jsonish.workspace = true
internal-llm-client.workspace = true
internal-baml-core.workspace = true
internal-baml-jinja.workspace = true
log.workspace = true
minijinja = { workspace = true, optional = true }
pin-project-lite.workspace = true
pretty = { workspace = true, optional = true }
percent-encoding.workspace = true
regex.workspace = true
reqwest-eventsource.workspace = true
scopeguard.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
strum.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
tokio = { workspace = true, default-features = false, features = [
  "macros",
  "time",
] }
tokio-stream.workspace = true
# NOTE(sam): adding this caused a build error, I suspect because tower uses nightly features or something
# tower = "0.5.0"
uuid.workspace = true
web-time.workspace = true
static_assertions.workspace = true
mime_guess.workspace = true
mime.workspace = true

# For tracing
envy.workspace = true
chrono.workspace = true
stream-cancel.workspace = true
async-std.workspace = true
fastrand.workspace = true
test-log.workspace = true
include_dir.workspace = true
infer.workspace = true
url.workspace = true
shell-escape.workspace = true
aws-sigv4 = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-runtime = { version = "1", optional = true }
aws-smithy-async = { version = "1", optional = true }
aws-smithy-runtime-api = { version = "1", optional = true }
aws-smithy-types = { version = "1", optional = true }
aws-smithy-runtime = { version = "1", optional = true }
enum_dispatch.workspace = true
aws-smithy-json = { version = "0.60", optional = true }
pretty_assertions.workspace = true
valuable.workspace = true
tracing.workspace = true
tracing-log.workspace = true
tracing-core.workspace = true
tracing-subscriber.workspace = true
log-once.workspace = true
once_cell.workspace = true
time.workspace = true
tempfile.workspace = true
sha2.workspace = true
blake3.workspace = true
flate2.workspace = true
similar.workspace = true

[dependencies.clap]
workspace = true
optional = true

[dependencies.generators-lib]
path = "../generators/utils/generators_lib"
optional = true

[dependencies.generators-openapi]
path = "../generators/languages/openapi"
optional = true

[dependencies.baml-viz-events]
path = "../baml-viz-events"
optional = true


[target.'cfg(target_arch = "wasm32")'.dependencies]
aws-config = { version = "1", default-features = false, features = [], optional = true }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = [], optional = true }
colored = { version = "2", default-features = false, features = [
  "no-color",
] }
futures-timer = { version = "3", features = ["wasm-bindgen"] }
js-sys.workspace = true
reqwest = { version = "0.12", features = [
  "stream",
  "json",
  "native-tls-vendored",
  "native-tls-alpn",
] }
#
send_wrapper = { version = "0.6", features = ["futures"] }
serde-wasm-bindgen = "0.6"
uuid = { workspace = true, features = ["v4", "serde", "js"] }
# WARNING: Do not add serde-serialize feature to wasm-bindgen.
# It may produce a dependency cycle in projects that use wasm and import baml.
wasm-bindgen = "^0.2.74"
wasm-bindgen-futures = "0.4"
web-sys.workspace = true
wasmtimer = "0.4"
tokio = { version = "1", features = ["rt", "sync"] }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-config = { version = "1", optional = true }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = [], optional = true }
# Required for native GCP/Vertex auth (TLS, JWT, etc.)
gcp_auth = { version = "0.12", optional = true }
hostname = "0.3"
jsonwebtoken = { version = "9", optional = true }
ring = { version = "0.17", features = ["std"], optional = true }
# Tokio: minimal set for runtime (no "full"). CLI/test_executor need signal; fs/process only used by CLI.
# When building with minimal-runtime only, this keeps tokio smaller than "full".
tokio = { version = "1", default-features = false, features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "macros",
  "time",
  "net",
  "io-util",
  "signal",
  "fs",
] }
reqwest.workspace = true
# CLI / codegen / dev-only (optional; omit with default-features = false, features = ["minimal-runtime"])
axum = { workspace = true, optional = true }
axum-extra = { version = "0.9", features = [
  "erased-json",
  "typed-header",
], optional = true }
criterion = { workspace = true, optional = true }
notify-debouncer-full = { version = "0.3", optional = true }
walkdir = { workspace = true, optional = true }
which = { version = "6", optional = true }
indicatif = { version = "0.17", optional = true }
junit-report = { version = "0.8", optional = true }
ratatui = { version = "0.29", optional = true }
unicode-width = { version = "0.1", optional = true }
dirs = { version = "5", optional = true }
supports-color = { version = "3", optional = true }
crossterm = { version = "0.28", optional = true }
reedline = { version = "0.37", optional = true }


[features]
default = [
  "skip-integ-tests",
  "codegen",
  "cli",
  "colored",
  "pretty",
  "aws",
  "gcp",
]
defaults = ["skip-integ-tests"]
internal = []
skip-integ-tests = []
# Colored terminal output (Display impls, tracing). Off in minimal-runtime.
colored = ["dep:colored"]
# Pretty-print control-flow (RcDoc). Off in minimal-runtime.
pretty = ["dep:pretty"]
# Use the THIR interpreter runtime instead of the VM bytecode runtime
thir-interpreter = []
# Minimal library surface: no CLI, no codegen, no cloud providers.
# Use: default-features = false, features = ["minimal-runtime"]
minimal-runtime = []
# AWS Bedrock provider support. Pulls in aws-sdk-bedrockruntime, aws-sigv4, aws-smithy-*, etc.
aws = [
  "dep:aws-sigv4",
  "dep:aws-credential-types",
  "dep:aws-runtime",
  "dep:aws-smithy-async",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
  "dep:aws-smithy-runtime",
  "dep:aws-smithy-json",
  "dep:aws-config",
  "dep:aws-sdk-bedrockruntime",
]
# GCP Vertex AI provider support. Pulls in gcp_auth, jsonwebtoken, ring.
gcp = ["dep:gcp_auth", "dep:jsonwebtoken", "dep:ring"]
# Codegen (generate_sdk, run_codegen). Enabled by default; off when using minimal-runtime.
codegen = ["dep:generators-lib", "dep:generators-openapi"]
# CLI (baml-cli, serve, repl, etc.). Enabled by default; off when using minimal-runtime.
# When cli is enabled, dependents (e.g. baml-cli) typically add tokio with "full"; Cargo unifies to full.
cli = [
  "dep:clap",
  "dep:minijinja",
  "colored",
  "pretty",
  "dep:axum",
  "dep:axum-extra",
  "dep:criterion",
  "dep:notify-debouncer-full",
  "dep:walkdir",
  "dep:which",
  "dep:indicatif",
  "dep:junit-report",
  "dep:ratatui",
  "dep:unicode-width",
  "dep:dirs",
  "dep:supports-color",
  "dep:crossterm",
  "dep:reedline",
]


[dev-dependencies]
assert_cmd = "2"
console_log = "1"
env_logger.workspace = true
criterion = "0.5"
dissimilar = "1"
expect-test = "1"
indoc.workspace = true
either = "1"
rstest = "0.22"
wasm-bindgen-test = "0.3"
walkdir = "2"
wasm-logger = "0.2"
serial_test = "3"
console_error_panic_hook = "0.1"
insta = { version = "1", features = ["yaml", "glob"] }
